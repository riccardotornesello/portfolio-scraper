name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(uv version --short)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match pyproject version ($VERSION)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import portfolio_scraper.etf"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/portfolio-scraper
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
